---
- name: Install Orchestrator Operator
  block:
  - name: Install Orchestrator Operator
    ansible.builtin.include_role:
      name: install_operator
    vars:
      install_operator_action: install
      install_operator_name: kubernetes-imagepuller-operator
      install_operator_namespace: openshift-operators
      install_operator_channel: "{{ ocp4_workload_kubernetes_image_puller_operator_channel }}"
      install_operator_catalog: community-operators
      install_operator_packagemanifest_name: kubernetes-imagepuller-operator
      install_operator_automatic_install_plan_approval: true
      install_operator_csv_nameprefix: kubernetes-imagepuller-operator

- name: Install KIP instance
  kubernetes.core.k8s:
    state: present
    namespace: "{{ ocp4_workload_kubernetes_image_puller_instance_namespace }}"
    definition: "{{ lookup('template', 'kubernetes_image_puller_instance.yml.j2') | from_yaml }}"

- name: Wait for kubernetes-image-puller deployment to exist
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: kubernetes-image-puller
    namespace: "{{ ocp4_workload_kubernetes_image_puller_instance_namespace }}"
  register: deployment_check
  until: deployment_check.resources | length > 0
  retries: 30
  delay: 10

- name: Wait for k8s-image-puller daemonset to exist
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: k8s-image-puller
    namespace: "{{ ocp4_workload_kubernetes_image_puller_instance_namespace }}"
  register: daemonset_check
  until: daemonset_check.resources | length > 0
  retries: 30
  delay: 10

- name: Set security context runAsUser on kubernetes-image-puller deployment
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: kubernetes-image-puller
    namespace: "{{ ocp4_workload_kubernetes_image_puller_instance_namespace }}"
    definition:
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 10001

- name: Set security context runAsUser on k8s-image-puller daemonset
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: DaemonSet
    name: k8s-image-puller
    namespace: "{{ ocp4_workload_kubernetes_image_puller_instance_namespace }}"
    definition:
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 10001

# Leave this as the last task in the playbook.
# --------------------------------------------
- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
